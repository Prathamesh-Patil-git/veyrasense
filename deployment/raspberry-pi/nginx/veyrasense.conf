
# ==============================================================================
# VeyraSense Gateway — Production Nginx Reverse Proxy
# Platform: Raspberry Pi 5 / Debian 13
#
# Frontend: /opt/veyrasense/current/frontend/dist
# Backend:  http://127.0.0.1:8000
# HTTP:     Port 80
# ==============================================================================

# ------------------------------------------------------------------------------
# WebSocket connection handling
# ------------------------------------------------------------------------------

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ------------------------------------------------------------------------------
# Rate limiting zones
# ------------------------------------------------------------------------------

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

# ------------------------------------------------------------------------------
# HTTP server
# ------------------------------------------------------------------------------

server {
    listen 80;
    listen [::]:80;

    server_name veyrasense.local _ localhost;

    # --------------------------------------------------------------------------
    # Client request limits
    # --------------------------------------------------------------------------

    client_max_body_size 10M;

    # --------------------------------------------------------------------------
    # Security headers
    # --------------------------------------------------------------------------

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; object-src 'none'; base-uri 'self'; frame-ancestors 'none';" always;

    # --------------------------------------------------------------------------
    # Compression
    # --------------------------------------------------------------------------

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;

    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/rss+xml
        font/woff2
        image/svg+xml;

    # --------------------------------------------------------------------------
    # Frontend static files
    # --------------------------------------------------------------------------

    root /opt/veyrasense/current/frontend/dist;
    index index.html;

    # Cache fingerprinted Vite assets
    location /assets/ {
        try_files $uri =404;

        expires 1y;

        add_header Cache-Control "public, no-transform, immutable" always;

        # Repeat server-level security headers because location-level
        # add_header directives override inheritance from the server block.
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; object-src 'none'; base-uri 'self'; frame-ancestors 'none';" always;

        access_log off;
    }

    # --------------------------------------------------------------------------
    # API health endpoint
    # --------------------------------------------------------------------------

    location = /api/v1/health {
        proxy_pass http://127.0.0.1:8000/api/v1/health;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout 15s;

        access_log off;
    }

    # --------------------------------------------------------------------------
    # Authentication login endpoint
    # --------------------------------------------------------------------------

    location = /api/v1/auth/login {
        limit_req zone=login_limit burst=3 nodelay;

        proxy_pass http://127.0.0.1:8000;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # --------------------------------------------------------------------------
    # General FastAPI API and WebSocket proxy
    # --------------------------------------------------------------------------

    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://127.0.0.1:8000;

        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # --------------------------------------------------------------------------
    # React Router SPA fallback
    # --------------------------------------------------------------------------

    location / {
        try_files $uri $uri/ /index.html;

        expires -1;

        add_header Cache-Control "no-store, no-cache, must-revalidate" always;

        # Repeat server-level security headers because location-level
        # add_header directives override inheritance from the server block.
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; object-src 'none'; base-uri 'self'; frame-ancestors 'none';" always;
    }

    # --------------------------------------------------------------------------
    # Logs
    # --------------------------------------------------------------------------

    access_log /var/log/nginx/veyrasense_access.log;
    error_log /var/log/nginx/veyrasense_error.log warn;
}
