# ==============================================================================
# VeyraSense Edge Gateway — Isolated Mosquitto Listener Configuration
# Deploy Location: /etc/mosquitto/conf.d/veyrasense.conf
# Target: Raspberry Pi 5 (Debian 13 Trixie, Mosquitto 2.0.21)
#
# Listener Architecture:
# - Port 1884: Dedicated to VeyraSense edge telemetry and ESP32 nodes
# - Port 1883: Retained untouched for CARES-RX with existing /etc/mosquitto/passwd
#
# Requires 'per_listener_settings true' in /etc/mosquitto/conf.d/00-coexistence.conf
# ==============================================================================

# Dedicated VeyraSense Listener on Port 1884
listener 1884 0.0.0.0

# Strict authentication: Anonymous connections strictly forbidden
allow_anonymous false

# VeyraSense-owned credentials and per-node ACLs (outside release directories)
password_file /var/lib/veyrasense/mosquitto/mosquitto_passwd
acl_file /var/lib/veyrasense/mosquitto/mosquitto.acl
