# ==============================================================================
# VeyraSense Edge Gateway — Mosquitto Configuration Template
# Target: Raspberry Pi 5 (Debian 13 Trixie, Mosquitto 2.0+)
# Deploy Location: /etc/mosquitto/conf.d/veyrasense.conf
#
# Coexistence Notice:
# Designed to coexist safely with existing Mosquitto installations (e.g. CARES-RX).
# CARES-RX retains listener port 1883 and /etc/mosquitto/passwd.
# VeyraSense operates on isolated listener port 1884.
# ==============================================================================

# Dedicated VeyraSense Listener on Port 1884
listener 1884 0.0.0.0

# Disable unauthenticated anonymous access for security
allow_anonymous false

# Dynamic Credentials & Per-Node ACL Files
# Managed dynamically by VeyraSense MosquittoProvisioningService
password_file /var/lib/veyrasense/mosquitto/mosquitto_passwd
acl_file /var/lib/veyrasense/mosquitto/mosquitto.acl
