# ==============================================================================
# VeyraSense Edge Gateway — Production Mosquitto Configuration
# Deploy Location: /etc/mosquitto/conf.d/99-veyrasense.conf
# Target: Raspberry Pi 5 (Debian 13 Trixie, Mosquitto 2.0+)
#
# Coexistence Notice:
# Designed to coexist safely with existing Mosquitto installations (e.g. CARES-RX).
# Does not overwrite primary /etc/mosquitto/mosquitto.conf or CARES-RX state.
# ==============================================================================

# Standard Port Listener (Configure if not already declared in primary mosquitto.conf)
listener 1883 0.0.0.0

# Disable unauthenticated anonymous access for security
allow_anonymous false

# Dynamic Credentials & Per-Node ACL Files
# Managed dynamically by VeyraSense MosquittoProvisioningService
password_file /var/lib/veyrasense/mosquitto/mosquitto_passwd
acl_file /var/lib/veyrasense/mosquitto/mosquitto.acl

# Logging configuration (appends to system mosquitto log without overwriting)
log_dest file /var/log/mosquitto/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# Connection Limits & Keepalive
max_keepalive 120
max_packet_size 65536
