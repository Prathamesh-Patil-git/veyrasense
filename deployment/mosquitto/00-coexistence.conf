# ==============================================================================
# Mosquitto Broker — Global Per-Listener Settings
# Deploy Location: /etc/mosquitto/conf.d/00-coexistence.conf
# Target: Raspberry Pi 5 (Debian 13 Trixie, Mosquitto 2.0+)
#
# Enables independent, isolated authentication and ACL scoping per listener.
# This ensures CARES-RX (Port 1883) and VeyraSense (Port 1884) operate with
# completely separate password files, access control lists, and security policies.
# ==============================================================================

per_listener_settings true
