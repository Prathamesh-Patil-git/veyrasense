name: VeyraSense CI Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. Backend Testing & Verification (Python 3.12 & Python 3.13 for Debian 13)
  # ============================================================================
  backend-tests:
    name: Backend Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Test Suite
        run: |
          pytest -v --tb=short

      - name: Verify Alembic Migrations Consistency
        run: |
          python -m alembic check || python -m alembic upgrade head

  # ============================================================================
  # 2. Frontend Strict Compilation & Production Bundle Build
  # ============================================================================
  frontend-build:
    name: Frontend Compilation & Production Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node.js dependencies
        run: npm ci

      - name: Compile TypeScript & Build Production Bundle
        run: npm run build

      - name: Upload Production Dist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  # ============================================================================
  # 3. Deployment Shell Scripts Validation
  # ============================================================================
  deployment-scripts-check:
    name: Deployment Scripts Syntax & ShellCheck
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check Bash Syntax
        run: |
          for script in deployment/raspberry-pi/scripts/*.sh; do
            echo "Checking syntax: $script"
            bash -n "$script"
          done

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: "deployment/raspberry-pi/scripts"
          severity: "warning"
          ignore_paths: ""
